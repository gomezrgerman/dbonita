<!--
  Plantilla EmailJS: AVISO AL NEGOCIO (cada reserva nueva)
    To Email:  {{to_email}}
    From Name: Web D Bonita
    Reply To:  {{cliente_email}}
    Subject:   Nueva reserva: {{cliente_nombre}} - {{fecha}} {{hora}}
  El ID de la plantilla va en la variable EMAILJS_TEMPLATE_NEGOCIO.
-->
<div style="font-family:Arial,Helvetica,sans-serif;color:#2c2420;font-size:15px;line-height:1.6">
  <h2 style="margin:0 0 12px">Nueva reserva desde la web</h2>
  <p style="margin:0"><strong>Clienta:</strong> {{cliente_nombre}}</p>
  <p style="margin:0"><strong>Telefono:</strong> {{cliente_telefono}}</p>
  <p style="margin:0"><strong>Email:</strong> {{cliente_email}}</p>
  <p style="margin:12px 0 0"><strong>Tratamiento:</strong> {{servicio}}</p>
  <p style="margin:0"><strong>Fecha:</strong> {{fecha}} a las {{hora}}</p>
  <p style="margin:0"><strong>Senal pagada:</strong> {{importe_pagado}}</p>
  <p style="margin:12px 0 0"><strong>Notas:</strong> {{notas}}</p>
  <p style="margin:16px 0 0;font-size:13px;color:#8a7060">Ya aparece en el panel: https://www.dbonita.es/panel</p>
</div>
