<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Sin conexión · D Bonita</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #ffffff; color: #111; padding: 24px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center;
    }
    .box { max-width: 320px; }
    img { width: 96px; height: 96px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    p { font-size: 15px; color: #555; line-height: 1.5; margin-bottom: 24px; }
    button {
      background: #6CC4E6; color: #1A3A4A; border: 2px solid #000; border-radius: 12px;
      box-shadow: 4px 4px 0 #000; font-size: 16px; font-weight: 700; padding: 12px 28px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="/icons/icon-192.png" alt="D Bonita">
    <h1>Sin conexión</h1>
    <p>No hay internet ahora mismo. En cuanto vuelva la conexión podrás ver las citas al día.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
